rules:
  - id: codesentry.java.sql-concatenation
    languages: [java]
    severity: ERROR
    message: SQL 语句使用字符串拼接，可能导致 SQL 注入；请改用参数化查询或预编译语句。
    metadata:
      category: security
      cwe: CWE-89
      owasp: A03:2021-Injection
      fix: 使用 PreparedStatement 或框架的参数绑定能力。
    patterns:
      - pattern-either:
          - pattern: $S.executeQuery($SQL + $X)
          - pattern: $S.executeUpdate($SQL + $X)
          - pattern: $S.execute($SQL + $X)
  - id: codesentry.java.command-execution
    languages: [java]
    severity: WARNING
    message: 检测到系统命令执行，请确认参数不受外部输入控制并采用白名单。
    metadata:
      category: security
      cwe: CWE-78
      owasp: A03:2021-Injection
      fix: 避免拼接命令；对命令和参数实施严格白名单。
    pattern-either:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: new ProcessBuilder(...)
  - id: codesentry.java.weak-message-digest
    languages: [java]
    severity: WARNING
    message: MD5 或 SHA-1 不适合安全敏感的摘要用途。
    metadata:
      category: security
      cwe: CWE-328
      owasp: A02:2021-Cryptographic Failures
      fix: 根据场景使用 SHA-256/512；密码存储使用 Argon2、bcrypt 或 PBKDF2。
    patterns:
      - pattern: MessageDigest.getInstance($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: '(?i)"(MD5|SHA-?1)"'
  - id: codesentry.java.weak-cipher
    languages: [java]
    severity: ERROR
    message: 检测到 DES、3DES、RC4 或 ECB 等弱加密配置。
    metadata:
      category: security
      cwe: CWE-327
      owasp: A02:2021-Cryptographic Failures
      fix: 优先使用 AES-GCM 或 ChaCha20-Poly1305 等认证加密算法。
    patterns:
      - pattern: Cipher.getInstance($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: '(?i)".*(DES|DESede|RC4|ECB).*"'
  - id: codesentry.java.insecure-trust-manager
    languages: [java]
    severity: ERROR
    message: 空实现的证书校验会绕过 TLS 服务端身份验证。
    metadata:
      category: security
      cwe: CWE-295
      owasp: A07:2021-Identification and Authentication Failures
      fix: 使用系统默认信任库或显式校验证书链和主机名。
    pattern: |
      new X509TrustManager() {
        ...
        public void checkServerTrusted(...) { }
        ...
      }
  - id: codesentry.javascript.eval
    languages: [javascript, typescript]
    severity: ERROR
    message: eval 会执行动态代码，外部输入可导致代码注入。
    metadata:
      category: security
      cwe: CWE-95
      owasp: A03:2021-Injection
      fix: 使用结构化解析或明确的函数映射替代 eval。
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: codesentry.javascript.unsafe-innerhtml
    languages: [javascript, typescript]
    severity: WARNING
    message: 直接写入 innerHTML 可能引入跨站脚本风险。
    metadata:
      category: security
      cwe: CWE-79
      owasp: A03:2021-Injection
      fix: 使用 textContent 或经过可信 HTML 净化器处理后再渲染。
    pattern: $EL.innerHTML = $VALUE
