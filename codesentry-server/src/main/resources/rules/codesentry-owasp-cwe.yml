rules:
  - id: codesentry.java.sql-concatenation
    languages: [java]
    severity: ERROR
    message: SQL 语句使用字符串拼接，可能导致 SQL 注入；请改用参数化查询或预编译语句。
    metadata:
      category: security
      cwe: CWE-89
      owasp: A03:2021-Injection
      fix: 使用 PreparedStatement 或框架的参数绑定能力。
    patterns:
      - pattern-either:
          - pattern: $S.executeQuery($SQL + $X)
          - pattern: $S.executeUpdate($SQL + $X)
          - pattern: $S.execute($SQL + $X)
  - id: codesentry.java.command-execution
    languages: [java]
    severity: WARNING
    message: 检测到系统命令执行，请确认参数不受外部输入控制并采用白名单。
    metadata:
      category: security
      cwe: CWE-78
      owasp: A03:2021-Injection
      fix: 避免拼接命令；对命令和参数实施严格白名单。
    pattern-either:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: new ProcessBuilder(...)
  - id: codesentry.java.weak-message-digest
    languages: [java]
    severity: WARNING
    message: MD5 或 SHA-1 不适合安全敏感的摘要用途。
    metadata:
      category: security
      cwe: CWE-328
      owasp: A02:2021-Cryptographic Failures
      fix: 根据场景使用 SHA-256/512；密码存储使用 Argon2、bcrypt 或 PBKDF2。
    patterns:
      - pattern: MessageDigest.getInstance($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: '(?i)"(MD5|SHA-?1)"'
  - id: codesentry.java.weak-cipher
    languages: [java]
    severity: ERROR
    message: 检测到 DES、3DES、RC4 或 ECB 等弱加密配置。
    metadata:
      category: security
      cwe: CWE-327
      owasp: A02:2021-Cryptographic Failures
      fix: 优先使用 AES-GCM 或 ChaCha20-Poly1305 等认证加密算法。
    patterns:
      - pattern: Cipher.getInstance($ALG)
      - metavariable-regex:
          metavariable: $ALG
          regex: '(?i)".*(DES|DESede|RC4|ECB).*"'
  - id: codesentry.java.insecure-trust-manager
    languages: [java]
    severity: ERROR
    message: 空实现的证书校验会绕过 TLS 服务端身份验证。
    metadata:
      category: security
      cwe: CWE-295
      owasp: A07:2021-Identification and Authentication Failures
      fix: 使用系统默认信任库或显式校验证书链和主机名。
    pattern: |
      new X509TrustManager() {
        ...
        public void checkServerTrusted(...) { }
        ...
      }
  - id: codesentry.jsp.request-to-file
    languages: [generic]
    paths:
      include:
        - "**/*.jsp"
        - "**/*.jspx"
    severity: ERROR
    message: JSP 请求参数可能参与文件路径或文件流构造，存在路径穿越或任意文件访问风险。
    metadata:
      category: security
      cwe: CWE-22
      owasp: A01:2021-Broken Access Control
      fix: 固定文件根目录，规范化路径后校验仍位于根目录内，并使用文件名白名单。
    pattern-either:
      - pattern-regex: '(?is)(?:new\s+(?:File|FileInputStream|FileOutputStream)|ImageIO\.write)\s*\([^;]{0,600}?request\.getParameter\s*\('
      - pattern-regex: '(?is)(?P<VAR>[A-Za-z_$][A-Za-z0-9_$]*)\s*=[^;\r\n]{0,160}?request\.getParameter\([^)]*\).{0,5000}?(?:new\s+(?:File|FileInputStream|FileOutputStream)|ImageIO\.write)\s*\([^;]{0,500}?(?P=VAR)'
  - id: codesentry.jsp.request-to-command
    languages: [generic]
    paths:
      include:
        - "**/*.jsp"
        - "**/*.jspx"
    severity: ERROR
    message: JSP 请求参数可能进入系统命令执行。
    metadata:
      category: security
      cwe: CWE-78
      owasp: A03:2021-Injection
      fix: 禁止外部输入参与命令构造；确有需要时对命令和参数分别实施严格白名单。
    pattern-either:
      - pattern-regex: '(?is)(?:Runtime\.getRuntime\(\)\.exec|new\s+ProcessBuilder)\s*\([^;]{0,600}?request\.getParameter\s*\('
      - pattern-regex: '(?is)(?P<VAR>[A-Za-z_$][A-Za-z0-9_$]*)\s*=[^;\r\n]{0,160}?request\.getParameter\([^)]*\).{0,5000}?(?:Runtime\.getRuntime\(\)\.exec|new\s+ProcessBuilder)\s*\([^;]{0,500}?(?P=VAR)'
  - id: codesentry.jsp.request-to-redirect
    languages: [generic]
    paths:
      include:
        - "**/*.jsp"
        - "**/*.jspx"
    severity: WARNING
    message: JSP 请求参数可能控制跳转地址，存在开放重定向风险。
    metadata:
      category: security
      cwe: CWE-601
      owasp: A01:2021-Broken Access Control
      fix: 仅允许跳转到服务端预定义的站内路径，不接受完整外部 URL。
    pattern-either:
      - pattern-regex: '(?is)response\.sendRedirect\s*\([^;]{0,600}?request\.getParameter\s*\('
      - pattern-regex: '(?is)(?P<VAR>[A-Za-z_$][A-Za-z0-9_$]*)\s*=[^;\r\n]{0,160}?request\.getParameter\([^)]*\).{0,5000}?response\.sendRedirect\s*\([^;]{0,500}?(?P=VAR)'
