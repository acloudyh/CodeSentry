server:
  address: ${CODESENTRY_SERVER_ADDRESS:127.0.0.1}
  port: ${CODESENTRY_SERVER_PORT:18080}

spring:
  application:
    name: codesentry-server
  datasource:
    url: ${CODESENTRY_DB_URL:jdbc:mysql://127.0.0.1:3306/codesentry?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${CODESENTRY_DB_USERNAME:root}
    password: ${CODESENTRY_DB_PASSWORD:6yhn^YHN}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql,classpath:db/migration/V2__add_ai_review.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

codesentry:
  storage:
    root: ${CODESENTRY_STORAGE_ROOT:${user.home}/.codesentry}
    repositories-directory: repositories
    snapshots-directory: snapshots
    reports-directory: reports
  git:
    executable: ${CODESENTRY_GIT_EXECUTABLE:git}
    command-timeout-seconds: 120
  scanning:
    worker-count: 2
    task-timeout-minutes: 30
  scanners:
    semgrep:
      enabled: ${CODESENTRY_SEMGREP_ENABLED:true}
      executable: ${CODESENTRY_SEMGREP_EXECUTABLE:semgrep}
      config: ${CODESENTRY_SEMGREP_CONFIG:auto}
    gitleaks:
      enabled: ${CODESENTRY_GITLEAKS_ENABLED:true}
      executable: ${CODESENTRY_GITLEAKS_EXECUTABLE:gitleaks}
    trivy:
      enabled: ${CODESENTRY_TRIVY_ENABLED:true}
      executable: ${CODESENTRY_TRIVY_EXECUTABLE:trivy}
      config: ${CODESENTRY_TRIVY_SCANNERS:secret}
      timeout-seconds: ${CODESENTRY_TRIVY_TIMEOUT_SECONDS:180}
      offline-scan: ${CODESENTRY_TRIVY_OFFLINE_SCAN:true}
  ai:
    enabled: ${CODESENTRY_AI_ENABLED:false}
    base-url: ${CODESENTRY_AI_BASE_URL:}
    model: ${CODESENTRY_AI_MODEL:}
    api-key: ${CODESENTRY_AI_API_KEY:}
    thinking-mode: ${CODESENTRY_AI_THINKING_MODE:}
    connect-timeout-seconds: ${CODESENTRY_AI_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${CODESENTRY_AI_READ_TIMEOUT_SECONDS:90}
    max-context-characters: ${CODESENTRY_AI_MAX_CONTEXT_CHARACTERS:12000}
    max-output-tokens: ${CODESENTRY_AI_MAX_OUTPUT_TOKENS:4096}
    max-concurrency: ${CODESENTRY_AI_MAX_CONCURRENCY:2}
    high-confidence-percent: ${CODESENTRY_AI_HIGH_CONFIDENCE_PERCENT:85}
