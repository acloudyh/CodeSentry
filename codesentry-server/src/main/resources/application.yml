server:
  address: ${CODESENTRY_SERVER_ADDRESS:127.0.0.1}
  port: ${CODESENTRY_SERVER_PORT:18080}

spring:
  servlet:
    multipart:
      max-file-size: 2048MB
      max-request-size: 2056MB
      file-size-threshold: 0
  application:
    name: codesentry-server
  datasource:
    url: ${CODESENTRY_DB_URL:jdbc:mysql://127.0.0.1:3306/codesentry?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${CODESENTRY_DB_USERNAME:root}
    password: ${CODESENTRY_DB_PASSWORD:6yhn^YHN}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-init-sql: SET time_zone = '+08:00'
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql,classpath:db/migration/V2__add_ai_review.sql,classpath:db/migration/V3__add_ai_runtime_configuration.sql,classpath:db/migration/V4__add_ai_tool_configuration.sql,classpath:db/migration/V5__report_acceptance.sql,classpath:db/migration/V6__business_projects.sql,classpath:db/migration/V7__git_credentials.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

codesentry:
  storage:
    root: ${CODESENTRY_STORAGE_ROOT:${user.home}/.codesentry}
    repositories-directory: repositories
    snapshots-directory: snapshots
    reports-directory: reports
  git:
    executable: ${CODESENTRY_GIT_EXECUTABLE:git}
    command-timeout-seconds: 120
  scanning:
    worker-count: 2
    task-timeout-minutes: 30
    excluded-globs:
      - "**/*.bmp"
      - "**/*.cab"
      - "**/*.doc"
      - "**/*.docx"
      - "**/*.eot"
      - "**/*.gif"
      - "**/*.ico"
      - "**/*.jpeg"
      - "**/*.jpg"
      - "**/*.map"
      - "**/*.mov"
      - "**/*.mp3"
      - "**/*.mp4"
      - "**/*.otf"
      - "**/*.pdf"
      - "**/*.png"
      - "**/*.sdoc"
      - "**/*.svg"
      - "**/*.swp"
      - "**/*.swo"
      - "**/*.tar"
      - "**/*.ttf"
      - "**/*.wav"
      - "**/*.wmv"
      - "**/*.woff"
      - "**/*.woff2"
      - "**/*.xls"
      - "**/*.xlsx"
      - "**/*.zip"
      - "**/*.min.js"
      - "**/jquery*.js"
      - "**/bootstrap*.js"
      - "**/echarts*.js"
      - "**/amcharts/**"
  scanners:
    semgrep:
      enabled: ${CODESENTRY_SEMGREP_ENABLED:true}
      executable: ${CODESENTRY_SEMGREP_EXECUTABLE:semgrep}
      config: ${CODESENTRY_SEMGREP_CONFIG:auto}
    gitleaks:
      enabled: ${CODESENTRY_GITLEAKS_ENABLED:true}
      executable: ${CODESENTRY_GITLEAKS_EXECUTABLE:gitleaks}
    trivy:
      enabled: ${CODESENTRY_TRIVY_ENABLED:true}
      executable: ${CODESENTRY_TRIVY_EXECUTABLE:trivy}
      config: ${CODESENTRY_TRIVY_SCANNERS:vuln,secret}
      timeout-seconds: ${CODESENTRY_TRIVY_TIMEOUT_SECONDS:180}
      offline-scan: ${CODESENTRY_TRIVY_OFFLINE_SCAN:true}
    spotbugs:
      enabled: ${CODESENTRY_SPOTBUGS_ENABLED:true}
      executable: ${CODESENTRY_SPOTBUGS_EXECUTABLE:spotbugs}
      config: ${CODESENTRY_FINDSECBUGS_PLUGIN:${user.home}/.codesentry/tools/findsecbugs-plugin-1.14.0.jar}
      include: ${CODESENTRY_SPOTBUGS_INCLUDE:com.srtech.*,com.lyq.*,PoiXlsJz.*}
      timeout-seconds: ${CODESENTRY_SPOTBUGS_TIMEOUT_SECONDS:600}
      max-heap-megabytes: ${CODESENTRY_SPOTBUGS_MAX_HEAP_MEGABYTES:2048}
    p3c:
      enabled: ${CODESENTRY_P3C_ENABLED:true}
      executable: ${CODESENTRY_JAVA_EXECUTABLE:java}
      config: ${CODESENTRY_P3C_JAR:${user.home}/.codesentry/tools/p3c-pmd-2.1.1-jar-with-dependencies.jar}
      include: ${CODESENTRY_P3C_JAVA_VERSION:1.8}
      timeout-seconds: ${CODESENTRY_P3C_TIMEOUT_SECONDS:600}
  remediation:
    timeout-seconds: ${CODESENTRY_REMEDIATION_TIMEOUT_SECONDS:600}
    max-queries: ${CODESENTRY_REMEDIATION_MAX_QUERIES:1000}
    max-response-megabytes: ${CODESENTRY_REMEDIATION_MAX_RESPONSE_MEGABYTES:32}
  ai:
    enabled: ${CODESENTRY_AI_ENABLED:false}
    base-url: ${CODESENTRY_AI_BASE_URL:}
    model: ${CODESENTRY_AI_MODEL:}
    api-key: ${CODESENTRY_AI_API_KEY:}
    keychain-service: ${CODESENTRY_AI_KEYCHAIN_SERVICE:CodeSentry-DeepSeek}
    keychain-account: ${CODESENTRY_AI_KEYCHAIN_ACCOUNT:${user.name}}
    thinking-mode: ${CODESENTRY_AI_THINKING_MODE:}
    connect-timeout-seconds: ${CODESENTRY_AI_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${CODESENTRY_AI_READ_TIMEOUT_SECONDS:90}
    max-context-characters: ${CODESENTRY_AI_MAX_CONTEXT_CHARACTERS:12000}
    max-output-tokens: ${CODESENTRY_AI_MAX_OUTPUT_TOKENS:4096}
    max-concurrency: ${CODESENTRY_AI_MAX_CONCURRENCY:4}
    high-confidence-percent: ${CODESENTRY_AI_HIGH_CONFIDENCE_PERCENT:85}
