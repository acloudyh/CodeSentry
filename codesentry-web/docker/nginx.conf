server {
    listen 443 ssl;
    ssl_certificate /etc/codesentry/tls/server.crt;
    ssl_certificate_key /etc/codesentry/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    error_page 497 =307 https://$http_host$request_uri;
    server_name _;
    client_max_body_size 2056m;
    client_body_timeout 300s;

    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/codesentry-security-headers.conf;

    location /api/ {
        proxy_pass http://codesentry-server:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 300s;
    }

    location /actuator/ {
        proxy_pass http://codesentry-server:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # 缺失的旧版本模块必须返回 404，不能回退成 HTML；入口页每次校验新版本。
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/codesentry-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        include /etc/nginx/codesentry-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
